<html lang="zh-CN">
<head>

  <link rel="stylesheet" href="https://unpkg.com/antd-mobile@5.39.0/bundle/style.css" />
  <style>
    :root{--adm-color-primary:#1677ff;--ink:#20314d;--muted:#73839c;--line:#e3eaf5;--font-xl:24px;--font-lg:17px;--font-md:17px;--font-body:15px;--font-caption:15px;--space-sm:8px;--space-md:16px;--space-lg:16px;--space-xl:24px;--adm-font-size-main:15px;--adm-font-size-1:15px;--adm-font-size-2:15px;--adm-font-size-3:15px;--adm-font-size-4:15px;--adm-font-size-5:15px;--adm-font-size-6:15px;--adm-font-size-7:15px;--adm-font-size-8:17px;--adm-font-size-9:17px;--adm-font-size-10:17px}
    *{box-sizing:border-box}
    body{margin:0;background:#fafafa;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;font-size:var(--font-body);padding-top:env(safe-area-inset-top);-webkit-font-smoothing:antialiased}
    h1,h2,h3,p{margin:0}
    button{font:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
    input,textarea,select{font:inherit}
    button:focus-visible,a:focus-visible{outline:3px solid #86b7ff;outline-offset:3px}
    button.clean{border:0;background:none;color:inherit}
    .app{background:#fafafa;max-width:560px;margin:0 auto;min-height:100vh;padding:0 0 max(32px,env(safe-area-inset-bottom))}
    @media(min-width:701px){.app{box-shadow:0 0 60px #1b4b8d10}}

    .hero{padding:18px 16px 4px;display:grid;gap:var(--space-md)}
    .loc{display:flex;align-items:center;gap:6px;font-size:var(--font-caption);color:#73839c}
    .loc b{color:#425b80;font-weight:600}
    .loc .dot{width:5px;height:5px;border-radius:50%;background:#bcd0ea;display:inline-block}
    .hero h1{font-size:var(--font-xl);letter-spacing:0;font-weight:700}
    .hero-desc{font-size:var(--font-body);line-height:1.8;color:#64748b}
    .metrics{display:flex;gap:var(--space-md);font-size:var(--font-caption);color:#73839c;flex-wrap:wrap}
    .metrics span{display:inline-flex;align-items:baseline;gap:4px}
    .metrics b{font-size:var(--font-lg);color:#2456a5;font-weight:700}

    .sticky-bar{position:sticky;top:0;z-index:20;background:#fafafa;padding:12px 16px 10px;display:grid;gap:10px}
    .search{background:#f0f5fd;border-radius:10px;padding:10px 14px}

    .seg{display:flex;gap:var(--space-sm);overflow-x:auto;scrollbar-width:none}

    .feed{padding:4px 16px 0;display:grid;gap:var(--space-lg)}

    .shop-card:active{border-color:#bcd0ea}
    .shop-card:focus-visible{outline:3px solid #86b7ff;outline-offset:2px}
    .shop-media{position:relative;aspect-ratio:16/10;display:grid;place-items:center;overflow:hidden}

    .media-emoji{position:relative;font-size:76px;line-height:1;filter:drop-shadow(0 12px 20px #20314d33)}
    .media-shade{position:absolute;inset:auto 0 0 0;height:46%;background:linear-gradient(transparent,#20314d1a)}

    .heart{position:absolute;right:12px;top:12px;width:36px;height:36px;border:0;border-radius:50%;background:#ffffffd9;display:grid;place-items:center;font-size:16px;color:#8ea0b8}
    .heart.on{color:#ff4d6a}
    .shop-body{padding:14px 16px 16px;display:grid;gap:9px}
    .shop-title{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
    .shop-title h3{font-size:var(--font-lg);font-weight:650}
    .rating{font-size:var(--font-caption);color:#2456a5;font-weight:700;white-space:nowrap}
    .rating small{font-weight:400;color:#8ea0b8;margin-left:4px}
    .shop-meta{font-size:var(--font-caption);color:#73839c;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
    .shop-meta .sep{color:#c4d2e6}
    .tags{display:flex;gap:6px;flex-wrap:wrap}
    .tag{font-size:13px;color:#527198;background:#f4f8ff;border:1px solid #dce7f7;border-radius:6px;padding:3px 8px}
    .blurb{font-size:var(--font-body);line-height:1.75;color:#536681;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
    .promo{justify-self:start;font-size:13px;color:#526d96;background:#edf4ff;border-radius:8px;padding:6px 10px;display:inline-flex;align-items:center;gap:6px}

    .feed-end{display:grid;gap:var(--space-md);justify-items:center;padding:24px 16px 8px;font-size:var(--font-caption);color:#8ea0b8;text-align:center}
    .empty{text-align:center;color:#73839c;font-size:var(--font-body);line-height:1.9;padding:48px 24px}

    .drawer{padding:0 0 max(24px,env(safe-area-inset-bottom))}
    .drawer-media{position:relative;height:180px;display:grid;place-items:center;overflow:hidden}
    .drawer-media .media-emoji{font-size:54px}
    .drawer-media .glow{width:124px;height:124px}

    .drawer-meta{font-size:var(--font-caption);color:#73839c;line-height:1.9}
    .drawer-lead{font-size:var(--font-body);line-height:1.85;color:#536681}
    .section-label{font-size:13px;color:#8ea0b8;letter-spacing:1px}
    .dishes{display:flex;gap:var(--space-sm);flex-wrap:wrap}
    .dish{font-size:var(--font-caption);color:#425b80;background:#f7faff;border:1px solid #e4edf9;border-radius:8px;padding:6px 10px}
    .quotes{display:grid;gap:10px}

    .drawer-actions{position:sticky;bottom:0;display:flex;gap:var(--space-sm);padding:12px var(--space-lg) max(12px,env(safe-area-inset-bottom));background:#fff;box-shadow:0 -12px 24px #fff}

    .adm-popup-body{left:0;right:0;margin:0 auto;max-width:560px;max-height:88vh;max-height:88dvh;overflow-y:auto;overscroll-behavior:contain}
    .footer{padding:var(--space-xl) 16px 0;font-size:13px;color:#a1aec2;text-align:center;line-height:1.9}

    .fallback{padding:24px 16px 32px;max-width:560px;margin:0 auto;font-size:var(--font-body);line-height:1.9}
    .fallback h1{font-size:var(--font-xl);margin:8px 0 12px}
    .fallback h2{font-size:var(--font-lg);margin:24px 0 10px}

    .fallback .offline-note{background:#edf4ff;color:#526d96;padding:12px 14px;border-radius:10px;font-size:13px}
    .fallback details{border:1px solid var(--line);background:#fff;border-radius:12px;padding:12px 14px;margin:10px 0}
    .fallback summary{cursor:pointer;font-weight:600}
    .fallback .loading{padding:10px 0;font-size:13px;color:#8ea0b8}
  </style>

  <script type="module">
    const root = document.getElementById('root');

      const [R, DOM, A] = await Promise.all([import('react'), import('react-dom/client'), import('antd-mobile')]);
      const {createElement:h, useState, useEffect, useRef} = R;
      const {Button, Input, Popup, Toast} = A;

      const shops = [
        {id:'m1',name:'胡同面包房',emoji:'🥐',hue:30,cat:'烘焙',rating:4.8,monthly:1268,price:32,dist:220,tags:['现烤','适合早午餐','窗外有梧桐'],promo:'满 50 减 10',blurb:'早上八点第一炉可颂，黄油香从门口一直飘到街角。木质长桌不赶人，适合带本书坐一上午。',dishes:['黄油可颂','海盐卷','肉桂苹果挞'],say:[{by:'隔壁写字楼 · 林',text:'可颂层次很分明，配一杯澳白刚好，十点前去还有热的。'},{by:'常客 · 阿泽',text:'座位不多但翻台快，周末要早点来。'}]},
        {id:'m2',name:'老灶川味小馆',emoji:'🌶️',hue:8,cat:'川菜',rating:4.7,monthly:2140,price:68,dist:480,tags:['下饭','两人份','老板会调辣度'],promo:'午市套餐 ¥48',blurb:'水煮鱼按份卖，鱼片厚实不柴。辣度可以点“微辣”，锅气还在，不会为了迁就口味丢味道。',dishes:['水煮鱼','干煸四季豆','蒜泥白肉'],say:[{by:'老顾客 · 陈',text:'两个人点三个菜就够了，米饭免费续。'},{by:'第一次来 · 小周',text:'微辣比想象中辣一点，但很香。'}]},
        {id:'m3',name:'深夜居酒屋 灯',emoji:'🍶',hue:222,cat:'日料',rating:4.6,monthly:860,price:128,dist:760,tags:['营业到 1 点','吧台六座','一个人也能坐'],promo:'',blurb:'吧台只有六个位置，师傅会问你今天想喝清爽的还是浓郁的。烤串按本点，适合下班后坐一小时。',dishes:['鸡皮串','明太子玉子烧','柚子highball'],say:[{by:'夜间常客 · J',text:'一个人吃饭不尴尬，师傅会聊天但不打扰。'},{by:'附近居民 · 吴',text:'十一点后安静很多，适合收尾。'}]},
        {id:'m4',name:'六号院咖啡',emoji:'☕️',hue:24,cat:'咖啡',rating:4.9,monthly:1580,price:38,dist:340,tags:['手冲','有院子','宠物友好'],promo:'第二杯半价',blurb:'藏在小院里，进门先过一个葡萄架。豆单每周换，手冲可以试喝两口再决定。',dishes:['耶加雪菲手冲','冰滴','巴斯克'],say:[{by:'咖啡爱好者 · 何',text:'豆单写得清楚，酸质描述挺准。'},{by:'带狗来 · 苏',text:'院子里有狗碗，很友好。'}]},
        {id:'m5',name:'阿婆牛杂粉',emoji:'🍜',hue:18,cat:'小吃',rating:4.5,monthly:3260,price:22,dist:150,tags:['开了 12 年','出餐快','可加辣'],promo:'',blurb:'汤底每天四点开始熬，牛杂处理得干净。小碗就够吃，加一份萝卜是本地人的点法。',dishes:['牛杂粉','萝卜','卤蛋'],say:[{by:'楼下住户 · 郑',text:'中午排队十分钟左右，出餐很快。'},{by:'上班族 · 高',text:'小碗加萝卜，22 块吃很饱。'}]},
        {id:'m6',name:'北岸轻食',emoji:'🥗',hue:140,cat:'轻食',rating:4.4,monthly:940,price:45,dist:610,tags:['低卡','热量标注','可堂食'],promo:'新客减 8',blurb:'每道菜都标了热量和蛋白质，酱汁单独放。鸡胸不是那种柴到嚼不动的做法。',dishes:['香煎鸡胸沙拉','南瓜藜麦碗','冷萃'],say:[{by:'健身 · 陆',text:'酱汁分开装这一点很加分。'},{by:'减脂期 · 唐',text:'份量比想象中大，晚饭吃刚好。'}]},
        {id:'m7',name:'炭火烧烤 老三',emoji:'🍢',hue:12,cat:'烧烤',rating:4.6,monthly:1780,price:78,dist:890,tags:['炭火','露天位','到凌晨 2 点'],promo:'满 100 减 15',blurb:'炭火烤，不是电炉。羊肉串肥瘦相间，老板会按人数劝你别点太多。夏天院子里有露天位。',dishes:['羊肉串','烤茄子','烤馒头片'],say:[{by:'老饕 · 马',text:'羊肉串一定要趁热吃，凉了差很多。'},{by:'住附近 · 韩',text:'院子氛围比里面好。'}]},
        {id:'m8',name:'潮汕牛肉火锅',emoji:'🍲',hue:352,cat:'火锅',rating:4.7,monthly:1120,price:118,dist:1200,tags:['现切','清汤锅','适合聚餐'],promo:'',blurb:'牛肉按部位现切，吊龙和匙柄各来一份。清汤锅底只放南姜和萝卜，吃的是肉本身的味道。',dishes:['吊龙','匙柄','手打牛肉丸'],say:[{by:'聚餐 · 郭',text:'六个人吃了两轮肉，人均没超 120。'},{by:'潮汕人 · 林',text:'部位分得对，涮八秒就可以。'}]},
        {id:'m9',name:'麦香早点铺',emoji:'🥟',hue:44,cat:'小吃',rating:4.5,monthly:2980,price:15,dist:90,tags:['六点开门','现包','只收早餐'],promo:'',blurb:'包子现包现蒸，六点半前到能吃到第一笼。豆浆是现磨的，可以要不加糖的。',dishes:['鲜肉包','素三鲜包','现磨豆浆'],say:[{by:'上班路过 · 罗',text:'六点四十去基本不用等。'},{by:'街坊 · 蒋',text:'豆浆有豆味，不是粉冲的。'}]},
        {id:'m10',name:'云间小酒馆',emoji:'🍷',hue:280,cat:'酒馆',rating:4.6,monthly:520,price:98,dist:1350,tags:['自然酒','小食好吃','适合聊天'],promo:'周三杯卖 8 折',blurb:'自然酒为主，可以按杯点，店员会先让你闻一下。小食只有六样，但每样都做得认真。',dishes:['起泡自然酒','油封沙丁鱼','烤布里'],say:[{by:'酒友 · 沈',text:'按杯点很友好，不怕踩雷。'},{by:'第一次来 · 尹',text:'灯光舒服，说话不用喊。'}]},
        {id:'m11',name:'江南面馆',emoji:'🍲',hue:196,cat:'面馆',rating:4.4,monthly:1650,price:36,dist:520,tags:['现炒浇头','汤面拌面','可免葱'],promo:'',blurb:'浇头现炒，腰花和鳝丝都处理得没有腥味。拌面会多给一勺葱油，汤面则配清汤。',dishes:['腰花面','鳝丝拌面','焖肉'],say:[{by:'本地人 · 顾',text:'拌面的葱油很香，稍微有点咸。'},{by:'加班 · 卢',text:'十点还能吃到热面。'}]},
        {id:'m12',name:'冰室 1987',emoji:'🍨',hue:326,cat:'甜品',rating:4.5,monthly:1340,price:28,dist:430,tags:['港式','菠萝油','下午茶'],promo:'双人套餐 ¥45',blurb:'菠萝油外皮够脆，黄油是厚切的。奶茶用丝袜拉过，甜度可以选，默认偏甜记得说少甜。',dishes:['菠萝油','丝袜奶茶','杨枝甘露'],say:[{by:'下午来 · 梁',text:'菠萝油要现点现夹，等五分钟值得。'},{by:'学生 · 邱',text:'套餐两个人吃刚好。'}]}
      ];

      const segs = ['推荐','附近','好评','有优惠','已收藏'];
      const favKey = 'merchant-feed-favs-v1';
      const money = n => '¥' + n;
      const dist = m => m < 1000 ? m + 'm' : (m / 1000).toFixed(1) + 'km';
      const mediaStyle = s => ({background: 'linear-gradient(135deg,hsl(' + s.hue + ' 74% 94%),hsl(' + (s.hue + 22) + ' 62% 85%))'});
      const avgRating = (shops.reduce((sum, s) => sum + s.rating, 0) / shops.length).toFixed(1);

      function App(){
        const [q, setQ] = useState('');
        const [seg, setSeg] = useState('推荐');
        const [fav, setFav] = useState(() => { try { const v = JSON.parse(localStorage.getItem(favKey) || '[]'); return Array.isArray(v) ? v : []; } catch { return []; } });
        const [open, setOpen] = useState(null);
        const [limit, setLimit] = useState(6);
        const sentinel = useRef(null);

        useEffect(() => { try { localStorage.setItem(favKey, JSON.stringify(fav)); } catch {} }, [fav]);

        const toggleFav = id => setFav(old => old.includes(id) ? old.filter(x => x !== id) : [...old, id]);

        const keyword = q.trim().toLowerCase();
        let list = shops.filter(s => !keyword || (s.name + s.cat + s.tags.join('') + s.blurb).toLowerCase().includes(keyword));
        if (seg === '附近') list = [...list].sort((a, b) => a.dist - b.dist);
        if (seg === '好评') list = [...list].sort((a, b) => b.rating - a.rating);
        if (seg === '有优惠') list = list.filter(s => s.promo);
        if (seg === '已收藏') list = list.filter(s => fav.includes(s.id));

        useEffect(() => {
          const el = sentinel.current;
          if (!el || !('IntersectionObserver' in window)) return;
          const io = new IntersectionObserver(es => { if (es.some(e => e.isIntersecting)) setLimit(l => l + 6); }, {rootMargin: '240px'});
          io.observe(el);
          return () => io.disconnect();
        }, [list.length, seg, keyword, limit < list.length]);

        const visible = list.slice(0, limit);

        const heart = (s, small) => h('button', {
          className: 'heart' + (fav.includes(s.id) ? ' on' : ''),
          'aria-label': (fav.includes(s.id) ? '取消收藏 ' : '收藏 ') + s.name,
          'aria-pressed': fav.includes(s.id),
          onClick: e => { e.stopPropagation(); toggleFav(s.id); Toast.show({content: fav.includes(s.id) ? '已取消收藏' : '已收藏 · 可在“已收藏”里查看', duration: 1400}); }
        }, fav.includes(s.id) ? '♥' : '♡');

        return h('div', {className: 'app'},
          h('header', {className: 'hero'},
            h('div', {className: 'loc'}, '朝阳 · 望京', h('span', {className: 'dot'}), '阜通东大街 6 号'),
            h('h1', null, '周边好店'),
            h('p', {className: 'hero-desc'}, '先看一张图，再看一句实话：为什么值得走这一趟。'),
            h('div', {className: 'metrics'},
              h('span', null, h('b', null, shops.length), '家好店'),
              h('span', null, h('b', null, avgRating), '平均评分'),
              h('span', null, h('b', null, '15'), '分钟步行圈')
            )
          ),
          h('div', {className: 'sticky-bar'},
            h('div', {className: 'search'}, h(Input, {value: q, onChange: setQ, placeholder: '搜店名、菜系或招牌菜', clearable: true, 'aria-label': '搜索商家'})),
            h('div', {className: 'seg'}, ...segs.map(s => h('button', {
              key: s, className: 'seg-item' + (seg === s ? ' active' : ''), 'aria-pressed': seg === s,
              onClick: () => { setSeg(s); setLimit(6); }
            }, s)))
          ),
          visible.length ? h('div', {className: 'feed'}, ...visible.map(s => h('article', {
            key: s.id, className: 'shop-card', role: 'button', tabIndex: 0,
            'aria-label': s.name + '，' + s.cat + '，评分 ' + s.rating + '，' + dist(s.dist),
            onClick: () => setOpen(s),
            onKeyDown: e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); setOpen(s); } }
          },
            h('div', {className: 'shop-media', style: mediaStyle(s)},
              h('div', {className: 'texture'}),
              h('div', {className: 'glow'}),
              h('span', {className: 'media-emoji'}, s.emoji),
              h('div', {className: 'media-shade'}),
              s.promo && h('span', {className: 'badge'}, '优惠'),
              heart(s)
            ),
            h('div', {className: 'shop-body'},
              h('div', {className: 'shop-title'}, h('h3', null, s.name), h('span', {className: 'rating'}, '★ ' + s.rating.toFixed(1), h('small', null, '月售 ' + s.monthly))),
              h('div', {className: 'shop-meta'}, s.cat, h('span', {className: 'sep'}, '·'), money(s.price) + '/人', h('span', {className: 'sep'}, '·'), dist(s.dist), h('span', {className: 'sep'}, '·'), '营业中'),
              h('p', {className: 'blurb'}, s.blurb),
              h('div', {className: 'tags'}, ...s.tags.map(t => h('span', {key: t, className: 'tag'}, t))),
              s.promo && h('span', {className: 'promo'}, h('span', {className: 'gift'}, '🎟'), s.promo)
            )
          ))) : h('div', {className: 'empty'}, seg === '已收藏' && !fav.length ? '还没有收藏的店。逛逛上面的推荐，看到喜欢的点右上角 ♡。' : '没有找到匹配的店。换个关键词，或看看“推荐”。'),
          list.length > visible.length && h('div', {ref: sentinel, className: 'feed-end'}, '正在加载更多好店…'),
          h('div', {className: 'footer'}, '示例商家与评价均为虚构，仅用于展示版面。收藏保存在本机。'),

          h(Popup, {
            visible: !!open, onMaskClick: () => setOpen(null), onClose: () => setOpen(null), showCloseButton: true,
            bodyStyle: {borderRadius: '18px 18px 0 0', maxWidth: 560}
          }, open && h('div', {className: 'drawer'},
            h('div', {className: 'drawer-media', style: mediaStyle(open)},
              h('div', {className: 'texture'}),
              h('div', {className: 'glow'}),
              h('span', {className: 'media-emoji'}, open.emoji),
              h('div', {className: 'media-shade'})
            ),
            h('div', {className: 'drawer-body'},
              h('h2', null, open.name),
              h('div', {className: 'drawer-meta'}, '★ ' + open.rating.toFixed(1) + ' · 月售 ' + open.monthly + ' · ' + open.cat + ' · ' + money(open.price) + '/人 · ' + dist(open.dist)),
              h('p', {className: 'drawer-lead'}, open.blurb),
              h('div', {className: 'tags'}, ...open.tags.map(t => h('span', {key: t, className: 'tag'}, t))),
              open.promo && h('span', {className: 'promo'}, h('span', {className: 'gift'}, '🎟'), open.promo),
              h('div', {className: 'section-label'}, '招牌'),
              h('div', {className: 'dishes'}, ...open.dishes.map(d => h('span', {key: d, className: 'dish'}, d))),
              h('div', {className: 'section-label'}, '常客怎么说'),
              h('div', {className: 'quotes'}, ...open.say.map(t => h('div', {key: t.by, className: 'quote'}, h('b', null, t.by), t.text)))
            ),
            h('div', {className: 'drawer-actions'},
              h(Button, {size: 'large', fill: 'outline', onClick: () => toggleFav(open.id)}, fav.includes(open.id) ? '♥ 已收藏' : '♡ 收藏'),
              h(Button, {size: 'large', color: 'primary', onClick: () => Toast.show({content: '演示环境：这里会打开导航', duration: 1600})}, '导航前往')
            )
          ))
        );
      }
      DOM.createRoot(root).render(h(App));
    } catch (error) {
      console.error(error);
      const status = document.getElementById('load-status');
      if (status) { status.setAttribute('role', 'status'); status.textContent = '当前为基础阅读版。联网后刷新可加载图片流、筛选与详情页。'; }
    }
  </script>
</body>
</html>
